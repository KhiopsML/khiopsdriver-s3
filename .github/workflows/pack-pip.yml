# This workflow will:
# - Build the source distribution (Python sdist)
# - Build the binary distributions (Python wheels)
# - Publish the sdist+wheels to test.pypi.org
# - Install package from test.pypi.org and run it for testing purposes
# - (DISABLED FOR NOW) Publish the package to pypi.org

name: pip Packaging
on: workflow_dispatch

defaults:
  run:
    shell: bash

jobs:
  build-sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - run: pipx run build --sdist

      - uses: actions/upload-artifact@v6
        with:
          name: pkg-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  build-wheel:
    name: Build wheel
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: ilammy/msvc-dev-cmd@v1

      - uses: pypa/cibuildwheel@v3.3.1

      - uses: actions/upload-artifact@v6
        with:
          name: pkg-wheel-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish-testpypi:
    name: Publish to Test.PyPI.org
    needs: [build-sdist, build-wheel]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/khiops-driver-s3
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: pkg-*
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  test-pkg-from-testpypi:
    name: Test package from Test.PyPI.org on ${{ matrix.os }}
    # needs: [publish-testpypi]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: 3.9

      - name: Create a virtual environment
        run: python -m venv venv

      - name: Create an environment variable pointing at the directory containing the executables (Linux and macOS)
        if: runner.os == 'Linux' || runner.os == 'macOS'
        run: echo "ENVBIN=venv/bin" >> "$GITHUB_ENV"

      - name: Create an environment variable pointing at the directory containing the executables (Windows)
        if: runner.os == 'Windows'
        run: echo "ENVBIN=venv/Scripts" >> "$GITHUB_ENV"

      - name: Install Khiops Core
        run: $ENVBIN/pip install --index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple khiops-core

      - name: Install package
        run: $ENVBIN/pip install -i https://test.pypi.org/simple/ khiops-driver-s3

      - name: Check that the driver is detected by Khiops Core (Linux and macOS)
        if: runner.os == 'Linux' || runner.os == 'macOS'
        run: $ENVBIN/khiops -s | grep 'S3 driver'

      - name: Add Intel MPI runtime to PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $impi = & "$env:ENVBIN\python.exe" -c "import os, impi_rt; print(os.path.dirname(impi_rt.__file__))"
          Write-Host "impi_rt dir: $impi"

          # Cherche impi.dll dans le package
          $impiDll = Get-ChildItem -Path $impi -Recurse -Filter "impi.dll" | Select-Object -First 1
          if (-not $impiDll) {
            Write-Error "impi.dll not found under impi_rt package"
            exit 1
          }

          $impiDir = $impiDll.DirectoryName
          Write-Host "Found impi.dll in: $impiDir"

          # Rend dispo pour les steps suivants
          Add-Content -Path $env:GITHUB_ENV -Value "PATH=$impiDir;$env:PATH"
        
      - name: Check that the driver is detected by Khiops Core (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $cmd = "$env:ENVBIN\khiops.cmd"
          $stdout = Join-Path $env:RUNNER_TEMP "khiops_stdout.txt"
          $stderr = Join-Path $env:RUNNER_TEMP "khiops_stderr.txt"

          # Exécute exactement: khiops.cmd -s
          $p = Start-Process -FilePath $cmd `
            -ArgumentList "-s" `
            -RedirectStandardOutput $stdout `
            -RedirectStandardError $stderr `
            -NoNewWindow `
            -PassThru

          # Timeout dur pour éviter les hangs CI
          if (-not $p.WaitForExit(60000)) {
            Stop-Process -Id $p.Id -Force
            Write-Error "Timeout: khiops -s did not finish within 60s"
            exit 1
          }

          $out = Get-Content $stdout -Raw -ErrorAction SilentlyContinue
          $err = Get-Content $stderr -Raw -ErrorAction SilentlyContinue

          # Logs utiles
          Write-Host "----- STDOUT -----"
          $out | Out-Host
          Write-Host "----- STDERR -----"
          $err | Out-Host
          Write-Host "ExitCode=$($p.ExitCode)"

          # Exigence: vérifier 'S3 driver' dans la sortie standard
          if ($out -notmatch 'S3 driver') {
            Write-Error "Pattern 'S3 driver' not found in stdout"
            exit 1
          }

