# This workflow will:
# - Build the source distribution (Python sdist)
# - Build the binary distributions (Python wheels)
# - Publish the sdist+wheels to test.pypi.org
# - Install package from test.pypi.org and run it for testing purposes
# - (DISABLED FOR NOW) Publish the package to pypi.org

name: pip Packaging
on: workflow_dispatch

defaults:
  run:
    shell: bash

jobs:
  build-sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - run: pipx run build --sdist

      - uses: actions/upload-artifact@v6
        with:
          name: pkg-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  build-wheel:
    name: Build wheel
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: ilammy/msvc-dev-cmd@v1

      - uses: pypa/cibuildwheel@v3.3.1

      - uses: actions/upload-artifact@v6
        with:
          name: pkg-wheel-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish-testpypi:
    name: Publish to Test.PyPI.org
    needs: [build-sdist, build-wheel]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/khiops-driver-s3
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: pkg-*
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  test-pkg-from-testpypi:
    name: Test package from Test.PyPI.org on ${{ matrix.os }}
    needs: [publish-testpypi]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: 3.9

      - name: Create a virtual environment
        run: python -m venv venv

      - name: Create an environment variable pointing at the directory containing the executables (Linux and macOS)
        if: runner.os == 'Linux' || runner.os == 'macOS'
        run: echo "ENVBIN=venv/bin" >> "$GITHUB_ENV"

      - name: Create an environment variable pointing at the directory containing the executables (Windows)
        if: runner.os == 'Windows'
        run: echo "ENVBIN=venv/Scripts" >> "$GITHUB_ENV"

      - name: Install Khiops Core
        run: $ENVBIN/pip install --index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple khiops-core

      - name: Install package
        run: $ENVBIN/pip install -i https://test.pypi.org/simple/ khiops-driver-s3

      - name: Check that the driver is detected by Khiops Core (Linux and macOS)
        if: runner.os == 'Linux' || runner.os == 'macOS'
        run: $ENVBIN/khiops -s | grep 'S3 driver'
        
      - name: Check that the driver is detected by Khiops Core (Windows)
        if: runner.os == 'Windows'
        run: cmd.exe "$ENVBIN\\khiops.cmd -s" | grep 'S3 driver'

