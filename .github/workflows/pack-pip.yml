# This workflow will:
# - Build the source distribution (Python sdist)
# - Build the binary distributions (Python wheels)
# - Publish the sdist+wheels to test.pypi.org
# - Install package from test.pypi.org and run it for testing purposes
# - (DISABLED FOR NOW) Publish the package to pypi.org

name: pip Packaging
on: workflow_dispatch

defaults:
  run:
    shell: bash

jobs:
  build-sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - run: pipx run build --sdist

      - uses: actions/upload-artifact@v6
        with:
          name: pkg-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  build-wheel:
    name: Build wheel
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: ilammy/msvc-dev-cmd@v1

      - uses: pypa/cibuildwheel@v3.3.1

      - uses: actions/upload-artifact@v6
        with:
          name: pkg-wheel-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish-testpypi:
    name: Publish to Test.PyPI.org
    needs: [build-sdist, build-wheel]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/khiops-driver-s3
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: pkg-*
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  test-pkg-from-testpypi:
    name: Test package from Test.PyPI.org on ${{ matrix.os }}
    needs: [publish-testpypi]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      # Fetch Iris test files
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            test/LearningTest
            test/LearningTestTool
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v6
        with:
          python-version: 3.9

      - name: Create a virtual environment
        run: python -m venv venv

      - name: Add the directory containing the executables to the PATH (Linux and macOS)
        if: runner.os == 'Linux' || runner.os == 'macOS'
        run: echo "$(pwd)/venv/bin" >> "$GITHUB_PATH"

      - name: Add the directory containing the executables to the PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "$((Resolve-Path 'venv/Scripts').Path)" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Khiops Core
        run: pip install --index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple khiops-core

      - name: Install driver
        run: pip install -i https://test.pypi.org/simple/ khiops-driver-s3

      - name: Print paths to executables (Linux and macOS)
        if: runner.os == 'Linux' || runner.os == 'macOS'
        run: |
          which python
          which pip
          which khiops

      - name: Print paths to executables (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          echo (Get-Command python -ErrorAction Stop).Source
          echo (Get-Command pip -ErrorAction Stop).Source
          echo (Get-Command khiops -ErrorAction Stop).Source

      - name: Check that the driver is detected by Khiops Core (Linux and macOS)
        if: runner.os == 'Linux' || runner.os == 'macOS'
        run: khiops -s | grep 'S3 driver'

      - name: Add Intel MPI runtime to PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $venvRoot = Resolve-Path "venv"
          Write-Host "venv root: $venvRoot"

          $impiDll = Get-ChildItem -Path $venvRoot -Recurse -Filter "impi.dll" -ErrorAction SilentlyContinue |
                    Select-Object -First 1

          if (-not $impiDll) {
            Write-Error "impi.dll not found in venv"
            exit 1
          }

          $impiDir = $impiDll.DirectoryName
          Write-Host "Found impi.dll in: $impiDir"

          "$impiDir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        
      - name: Check that the driver is detected by Khiops Core (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $cmd = (Get-Command khiops.cmd -ErrorAction Stop).Source
          $stdout = Join-Path $env:RUNNER_TEMP "khiops_stdout.txt"
          $stderr = Join-Path $env:RUNNER_TEMP "khiops_stderr.txt"

          $p = Start-Process -FilePath $cmd `
            -ArgumentList "-s" `
            -RedirectStandardOutput $stdout `
            -RedirectStandardError $stderr `
            -NoNewWindow `
            -PassThru

          if (-not $p.WaitForExit(60000)) {
            Stop-Process -Id $p.Id -Force
            Write-Error "Timeout: khiops -s did not finish within 60s"
            exit 1
          }

          $out = Get-Content $stdout -Raw -ErrorAction SilentlyContinue
          $err = Get-Content $stderr -Raw -ErrorAction SilentlyContinue

          Write-Host "----- STDOUT -----"
          $out | Out-Host
          Write-Host "----- STDERR -----"
          $err | Out-Host
          Write-Host "ExitCode=$($p.ExitCode)"

          if ($out -notmatch 'S3 driver') {
            Write-Error "Pattern 'S3 driver' not found in stdout"
            exit 1
          }

      - name: Test Khiops+driver on Iris dataset
        env:
          KHIOPS_PROC_NUMBER: 4
          # Use more processes than available CPUs: OpenMPI < 5
          OMPI_MCA_rmaps_base_oversubscribe: true
          # Use more processes than available CPUs: OpenMPI >= 5
          PRTE_MCA_rmaps_default_mapping_policy: :oversubscribe
          KHIOPS_API_MODE: true
          KHIOPS_MPI_VERBOSE: true
          AWS_ENDPOINT_URL: ${{ vars.AWS_ENDPOINT_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          S3_DRIVER_LOGLEVEL: warning
          S3_DRIVER_LOGFILE: /dev/stderr
        run: |
          cd test/LearningTest/TestKhiops/Standard/Iris/
          khiops -b -i test.prm -e results/err.txt
          cd -
          touch test/LearningTest/TestKhiops/Standard/Iris/results/time.log
          echo "Check test results"
          cd test/LearningTestTool/py/
          python kht_test.py ../../LearningTest/TestKhiops/Standard/Iris check
          python kht_apply.py ../../LearningTest/TestKhiops/Standard/Iris errors | tee /tmp/khiops-log.txt
          python kht_collect_results.py ../../LearningTest/TestKhiops/Standard/Iris $GITHUB_WORKSPACE/results/khiops --collect-type warnings
          if (grep -q error /tmp/khiops-log.txt); then
            echo "::error::Errors in Khiops run"
            false
          fi

